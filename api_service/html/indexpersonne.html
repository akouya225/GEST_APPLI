<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Liste des personnes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Chargement du sidebar -->
            <div id="sidebar"></div> 

            <div class="main-panel">
                <div class="content-wrapper">
                    <h2>Liste des personnes</h2>
                    <button class="btn btn-success" onclick="location.href='ajouter_personne.php'">
                        <i class="fas fa-user-plus me-2"></i> Ajouter une personne
                    </button>
                    <table class="table table-striped table-bordered table-sm text-center">
                        <thead class="thead-light">
                            <tr>
                                <th>ID</th>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>Email</th>
                                <th>Téléphone</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="geo-data">
                            <!-- Données insérées ici par jQuery -->
                        </tbody>
                    </table>
                </div>
                <!-- main-panel ends -->
            </div>
            <!-- page-body-wrapper ends -->
        </div>
        <!-- container-scroller -->
    </div>

    <script>
        $(document).ready(function() {
            // Charger le sidebar
            $("#sidebar").load("sidebar.html");

            // Charger les données des personnes
            $.ajax({
                url: "http://localhost/gest_app/api_service/service/personneApi.php",

                method: "GET",
                dataType: "json",
                success: function(data) {
                    data.forEach(function(item) {
                        $("#geo-data").append(
                            `<tr>
                                <td>${item.id}</td>
                                <td>${item.nom}</td>
                                <td>${item.prenom}</td>
                                <td>${item.email}</td>
                                <td>${item.telephone}</td>
                                <td>
                                    <a href='listpersonne.php?id=${item.id}' class='btn btn-outline-info'>
                                        <i class='fas fa-plus'></i> 
                                    </a>
                                    <a href='details_personne.php?id=${item.id}' class='btn btn-outline-info'>
                                        <i class='fas fa-eye'></i> 
                                    </a>
                                    <a href='modifier_personne.php?id=${item.id}' class='btn btn-outline-warning'>
                                        <i class='fas fa-edit'></i> 
                                    </a>
                                    <a href='supprimer_personne.php?id=${item.id}' class='btn btn-outline-danger'>
                                        <i class='fas fa-trash-alt'></i> 
                                    </a>
                                </td>
                            </tr>`
                        );
                    });
                },
                error: function() {
                    alert("Erreur lors du chargement des données.");
                }
            });
        });
    </script>
</body>

</html>
